services:
  - type: web
    name: careerpath-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerpath-db
          property: connectionString

databases:
  - name: careerpath-db
    plan: free
    databaseName: careerpath
    user: careerpath_user
